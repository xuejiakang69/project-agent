name: Build and Deploy Agent Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent-test
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and VERSION
        id: release
        shell: bash
        run: |
          set -euo pipefail

          test -f VERSION
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid VERSION: $VERSION_VALUE" >&2
            exit 1
          }

          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "HEAD must be exactly on a version tag such as v1.0.2." >&2
            exit 1
          }

          TAG_VERSION="${TAG#v}"
          [[ "$TAG_VERSION" == "$VERSION_VALUE" ]] || {
            echo "VERSION ($VERSION_VALUE) does not match checked-out tag ($TAG)." >&2
            exit 1
          }

          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Validated release: $TAG ($(git rev-parse HEAD))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: vue-project/package-lock.json

      - name: Install Vue dependencies
        working-directory: vue-project
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Verify Rolldown native binding
        working-directory: vue-project
        run: |
          node --version
          npm --version
          npm ls @rolldown/binding-linux-x64-gnu

      - name: Build Vue frontend
        working-directory: vue-project
        env:
          VITE_API_BASE_URL: https://api-test.online3.me/api
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html

      - name: Check backend files
        run: |
          set -euo pipefail
          test -f back/app/main.py
          test -f back/app/config.py
          test -f back/app/agent/crud/kb.py
          test -f back/requirements-deploy.txt
          python3 -m compileall -q back/app

      - name: Package backend
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            --exclude='back/.env' \
            --exclude='back/.env*' \
            --exclude='back/**/.env*' \
            --exclude='back/venv' \
            --exclude='back/.venv' \
            --exclude='back/__pycache__' \
            --exclude='back/**/__pycache__' \
            --exclude='back/data/chroma' \
            --exclude='back/data/uploads' \
            --exclude='back/uploads' \
            --exclude='back/model-cache' \
            --exclude='back/.pytest_cache' \
            --exclude='back/.git' \
            -cf - back | gzip -n > "$RUNNER_TEMP/backend.tar.gz"

          tar -tzf "$RUNNER_TEMP/backend.tar.gz" | awk 'NR <= 40'
          tar -xOf "$RUNNER_TEMP/backend.tar.gz" back/app/agent/crud/kb.py > "$RUNNER_TEMP/kb.py"
          grep -Fq 'import pysqlite3' "$RUNNER_TEMP/kb.py"
          grep -Fq 'sys.modules["sqlite3"] = pysqlite3' "$RUNNER_TEMP/kb.py"
          echo "SQLite compatibility code check passed."

          tar -xOf "$RUNNER_TEMP/backend.tar.gz" back/requirements-deploy.txt > "$RUNNER_TEMP/requirements-deploy.txt"
          grep -Fxq 'pysqlite3-binary==0.5.4' "$RUNNER_TEMP/requirements-deploy.txt"
          echo "SQLite compatibility dependency check passed."

      - name: Package frontend
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C vue-project dist | gzip -n > "$RUNNER_TEMP/frontend.tar.gz"
          tar -tzf "$RUNNER_TEMP/frontend.tar.gz" | awk 'NR <= 20'

      - name: Validate release archives
        run: |
          python3 - "$RUNNER_TEMP/backend.tar.gz" "$RUNNER_TEMP/frontend.tar.gz" <<'PY'
          import posixpath
          import sys
          import tarfile

          for archive in sys.argv[1:]:
              entries = {}
              with tarfile.open(archive, "r:gz") as tar:
                  for member in tar:
                      name = member.name
                      if not name or "\x00" in name or "\\" in name:
                          raise SystemExit(f"Invalid archive path: {name!r}")
                      if name.startswith("/"):
                          raise SystemExit(f"Absolute path rejected: {name!r}")
                      parts = name.rstrip("/").split("/")
                      if any(part in ("", ".", "..") for part in parts):
                          raise SystemExit(f"Unsafe archive path: {name!r}")
                      normalized = posixpath.normpath(name)
                      if normalized in entries:
                          raise SystemExit(f"Duplicate archive path: {name!r}")
                      if not (member.isdir() or member.isfile()):
                          raise SystemExit(f"Unsupported archive entry type: {name!r}")
                      for index in range(1, len(parts)):
                          parent = "/".join(parts[:index])
                          if entries.get(parent) == "file":
                              raise SystemExit(f"File used as parent directory: {parent!r}")
                      if member.isfile():
                          prefix = normalized + "/"
                          if any(path.startswith(prefix) for path in entries):
                              raise SystemExit(f"File conflicts with child paths: {name!r}")
                      entries[normalized] = "dir" if member.isdir() else "file"
              print(f"Archive validation passed: {archive}")
          PY

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Upload immutable release package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="${{ steps.release.outputs.version }}"
          RELEASE_TAG="${{ steps.release.outputs.tag }}"
          GIT_SHA="${{ steps.release.outputs.sha }}"
          UPLOAD_ID="${VERSION_VALUE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          STAGING="/home/deploy/deploy-staging"
          INCOMING="$STAGING/incoming/$UPLOAD_ID"
          READY="$STAGING/ready/$VERSION_VALUE"

          printf '%s\n' "$VERSION_VALUE" > "$RUNNER_TEMP/release_id"
          printf '%s\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release_tag"
          printf '%s\n' "$GIT_SHA" > "$RUNNER_TEMP/git_sha"
          (
            cd "$RUNNER_TEMP"
            sha256sum backend.tar.gz frontend.tar.gz release_id release_tag git_sha > SHA256SUMS
          )

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$DEPLOY_PORT" "$REMOTE" \
            "test -d '$STAGING' && test -w '$STAGING'"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$DEPLOY_PORT" "$REMOTE" \
            bash -s -- "$STAGING" "$UPLOAD_ID" <<'REMOTE'
          set -euo pipefail
          STAGING="$1"
          UPLOAD_ID="$2"
          INCOMING="$STAGING/incoming/$UPLOAD_ID"
          mkdir -p "$STAGING/incoming" "$STAGING/ready"
          if [[ -e "$INCOMING" || -L "$INCOMING" ]]; then
            echo "ERROR: upload directory already exists: $INCOMING" >&2
            exit 1
          fi
          mkdir -m 750 "$INCOMING"
          REMOTE

          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/release_id" "$RUNNER_TEMP/release_tag" "$RUNNER_TEMP/git_sha" \
            "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/backend.tar.gz" "$RUNNER_TEMP/frontend.tar.gz" \
            "$REMOTE:$INCOMING/"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$DEPLOY_PORT" "$REMOTE" \
            bash -s -- "$STAGING" "$UPLOAD_ID" "$VERSION_VALUE" <<'REMOTE'
          set -euo pipefail
          STAGING="$1"
          UPLOAD_ID="$2"
          VERSION_VALUE="$3"
          INCOMING="$STAGING/incoming/$UPLOAD_ID"
          READY="$STAGING/ready/$VERSION_VALUE"

          [[ -d "$INCOMING" && ! -L "$INCOMING" ]]
          [[ "$(tr -d '\r\n' < "$INCOMING/release_id")" == "$VERSION_VALUE" ]]
          [[ "$(tr -d '\r\n' < "$INCOMING/release_tag")" == "v$VERSION_VALUE" ]]
          [[ "$(tr -d '\r\n' < "$INCOMING/git_sha")" =~ ^[0-9a-f]{40}$ ]]
          (cd "$INCOMING" && sha256sum -c SHA256SUMS)
          tar -tzf "$INCOMING/backend.tar.gz" >/dev/null
          tar -tzf "$INCOMING/frontend.tar.gz" >/dev/null

          if [[ -e "$READY" || -L "$READY" ]]; then
            [[ -d "$READY" && ! -L "$READY" ]] || {
              echo "ERROR: ready path is not a normal directory; refusing overwrite." >&2
              exit 1
            }
            (cd "$READY" && sha256sum -c SHA256SUMS)
            if cmp -s "$INCOMING/SHA256SUMS" "$READY/SHA256SUMS" \
              && cmp -s "$INCOMING/release_id" "$READY/release_id" \
              && cmp -s "$INCOMING/release_tag" "$READY/release_tag" \
              && cmp -s "$INCOMING/git_sha" "$READY/git_sha"; then
              rm -rf -- "$INCOMING"
              echo "Identical immutable release package already exists; reusing it."
            else
              echo "ERROR: version $VERSION_VALUE already exists with different contents. Use a new VERSION and Git tag." >&2
              echo "Incoming package retained at: $INCOMING" >&2
              exit 1
            fi
          else
            mv -T -- "$INCOMING" "$READY"
            echo "Validated immutable release package: $READY"
          fi
          REMOTE

      - name: Deploy frontend and backend with rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_RESTART_CMD: ${{ secrets.BACKEND_RESTART_CMD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BACKEND_RESTART_CMD:-}" ]] || {
            echo "BACKEND_RESTART_CMD secret is required (for example, a command authorized to restart fastapi-test.service)." >&2
            exit 1
          }

          VERSION_VALUE="${{ steps.release.outputs.version }}"
          RELEASE_TAG="${{ steps.release.outputs.tag }}"
          GIT_SHA="${{ steps.release.outputs.sha }}"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          READY="/home/deploy/deploy-staging/ready/$VERSION_VALUE"
          BACKEND_BASE="/www/wwwroot/fastapi/fastapi-test"
          FRONTEND_BASE="/www/wwwroot/vue/vue-test"

          RESTART_CMD_B64="$(printf '%s' "$BACKEND_RESTART_CMD" | base64 -w 0)"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$DEPLOY_PORT" "$REMOTE" \
            bash -s -- "$READY" "$BACKEND_BASE" "$FRONTEND_BASE" "$VERSION_VALUE" "$RELEASE_TAG" "$GIT_SHA" "$RESTART_CMD_B64" <<'REMOTE'
          set -Eeuo pipefail

          READY="$1"
          BACKEND_BASE="$2"
          FRONTEND_BASE="$3"
          VERSION_VALUE="$4"
          RELEASE_TAG="$5"
          GIT_SHA="$6"
          RESTART_CMD="$(printf '%s' "$7" | base64 -d)"
          [[ -n "$RESTART_CMD" ]]

          BACKEND_RELEASES="$BACKEND_BASE/releases"
          FRONTEND_RELEASES="$FRONTEND_BASE/releases"
          BACKEND_RELEASE="$BACKEND_RELEASES/v$VERSION_VALUE"
          FRONTEND_RELEASE="$FRONTEND_RELEASES/v$VERSION_VALUE"
          BACKEND_CURRENT="$BACKEND_BASE/current"
          FRONTEND_CURRENT="$FRONTEND_BASE/current"
          FRONTEND_DIST="$FRONTEND_BASE/dist"
          SHARED="$BACKEND_BASE/shared"
          TEMP_SUFFIX="$$"
          BACKEND_LINK_TMP="$BACKEND_BASE/.current.new.$TEMP_SUFFIX"
          FRONTEND_LINK_TMP="$FRONTEND_BASE/.current.new.$TEMP_SUFFIX"
          DIST_BACKUP=""
          OLD_BACKEND_TARGET=""
          OLD_FRONTEND_TARGET=""
          BACKEND_SWITCHED=0
          FRONTEND_SWITCHED=0
          DIST_MIGRATED=0
          DEPLOY_OK=0

          [[ "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_TAG" == "v$VERSION_VALUE" ]]
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -d "$READY" && ! -L "$READY" ]]
          [[ -f "$READY/backend.tar.gz" && -f "$READY/frontend.tar.gz" ]]
          (cd "$READY" && sha256sum -c SHA256SUMS)
          [[ "$(tr -d '\r\n' < "$READY/release_id")" == "$VERSION_VALUE" ]]
          [[ "$(tr -d '\r\n' < "$READY/release_tag")" == "$RELEASE_TAG" ]]
          [[ "$(tr -d '\r\n' < "$READY/git_sha")" == "$GIT_SHA" ]]

          # Refuse to operate on unexpected paths or incomplete shared state.
          [[ -d "$BACKEND_BASE" && ! -L "$BACKEND_BASE" ]]
          [[ -d "$FRONTEND_BASE" && ! -L "$FRONTEND_BASE" ]]
          [[ -f "$SHARED/.env" && -s "$SHARED/.env" ]]
          [[ -d "$SHARED/data" && -d "$SHARED/uploads" ]]
          [[ -x "$BACKEND_BASE/venv/bin/uvicorn" ]]
          [[ ! -e "$BACKEND_RELEASE" && ! -L "$BACKEND_RELEASE" ]] || {
            echo "ERROR: backend release already exists; refusing to overwrite: $BACKEND_RELEASE" >&2
            exit 1
          }
          [[ ! -e "$FRONTEND_RELEASE" && ! -L "$FRONTEND_RELEASE" ]] || {
            echo "ERROR: frontend release already exists; refusing to overwrite: $FRONTEND_RELEASE" >&2
            exit 1
          }
          [[ ! -e "$BACKEND_CURRENT" || -L "$BACKEND_CURRENT" ]] || {
            echo "ERROR: backend current is not a symlink; refusing migration." >&2
            exit 1
          }
          [[ ! -e "$FRONTEND_CURRENT" || -L "$FRONTEND_CURRENT" ]] || {
            echo "ERROR: frontend current is not a symlink; refusing migration." >&2
            exit 1
          }

          if [[ -L "$BACKEND_CURRENT" ]]; then
            OLD_BACKEND_TARGET="$(readlink "$BACKEND_CURRENT")"
          fi
          if [[ -L "$FRONTEND_CURRENT" ]]; then
            OLD_FRONTEND_TARGET="$(readlink "$FRONTEND_CURRENT")"
          fi

          rollback() {
            status=$?
            if [[ "$DEPLOY_OK" -eq 1 ]]; then
              return "$status"
            fi
            trap - ERR INT TERM
            set +e
            echo "Deployment failed; attempting rollback." >&2

            if [[ "$BACKEND_SWITCHED" -eq 1 ]]; then
              if [[ -n "$OLD_BACKEND_TARGET" ]]; then
                ln -sfn -- "$OLD_BACKEND_TARGET" "$BACKEND_LINK_TMP"
                mv -Tf -- "$BACKEND_LINK_TMP" "$BACKEND_CURRENT"
              else
                rm -f -- "$BACKEND_CURRENT"
              fi
            fi

            if [[ "$FRONTEND_SWITCHED" -eq 1 ]]; then
              if [[ -n "$OLD_FRONTEND_TARGET" ]]; then
                ln -sfn -- "$OLD_FRONTEND_TARGET" "$FRONTEND_LINK_TMP"
                mv -Tf -- "$FRONTEND_LINK_TMP" "$FRONTEND_CURRENT"
              else
                rm -f -- "$FRONTEND_CURRENT"
              fi
            fi

            if [[ "$DIST_MIGRATED" -eq 1 && -n "$DIST_BACKUP" && -d "$DIST_BACKUP" ]]; then
              rm -f -- "$FRONTEND_DIST"
              mv -- "$DIST_BACKUP" "$FRONTEND_DIST"
            fi

            bash -lc "$RESTART_CMD"
            exit "$status"
          }
          trap rollback ERR INT TERM

          mkdir -p "$BACKEND_RELEASES" "$FRONTEND_RELEASES"
          BACKEND_TEMP="$BACKEND_RELEASES/.v$VERSION_VALUE.tmp.$TEMP_SUFFIX"
          FRONTEND_TEMP="$FRONTEND_RELEASES/.v$VERSION_VALUE.tmp.$TEMP_SUFFIX"
          [[ ! -e "$BACKEND_TEMP" && ! -L "$BACKEND_TEMP" ]]
          [[ ! -e "$FRONTEND_TEMP" && ! -L "$FRONTEND_TEMP" ]]
          mkdir -m 750 "$BACKEND_TEMP" "$FRONTEND_TEMP"

          tar -xzf "$READY/backend.tar.gz" -C "$BACKEND_TEMP"
          tar -xzf "$READY/frontend.tar.gz" -C "$FRONTEND_TEMP"
          [[ -f "$BACKEND_TEMP/back/app/main.py" ]]
          [[ -f "$BACKEND_TEMP/back/requirements-deploy.txt" ]]
          [[ -s "$FRONTEND_TEMP/dist/index.html" ]]

          # Use the existing shared environment and persistent data; never package .env or runtime data into releases.
          [[ -d "$BACKEND_TEMP/back/data" && ! -L "$BACKEND_TEMP/back/data" ]] || {
            echo "ERROR: expected a normal packaged back/data directory before linking shared data." >&2
            exit 1
          }
          rm -rf -- "$BACKEND_TEMP/back/data"
          ln -s "$SHARED/data" "$BACKEND_TEMP/back/data"

          [[ ! -e "$BACKEND_TEMP/back/.env" && ! -L "$BACKEND_TEMP/back/.env" ]]
          ln -s "$SHARED/.env" "$BACKEND_TEMP/back/.env"

          if [[ -e "$BACKEND_TEMP/back/uploads" || -L "$BACKEND_TEMP/back/uploads" ]]; then
            [[ ! -L "$BACKEND_TEMP/back/uploads" ]] || {
              echo "ERROR: unexpected uploads symlink in release package." >&2
              exit 1
            }
            rm -rf -- "$BACKEND_TEMP/back/uploads"
          fi
          ln -s "$SHARED/uploads" "$BACKEND_TEMP/back/uploads"
          ln -s "$BACKEND_BASE/venv" "$BACKEND_TEMP/venv"

          mv -- "$BACKEND_TEMP" "$BACKEND_RELEASE"
          mv -- "$FRONTEND_TEMP" "$FRONTEND_RELEASE"

          # Preserve the existing plain dist directory before converting it to a symlink.
          if [[ -d "$FRONTEND_DIST" && ! -L "$FRONTEND_DIST" ]]; then
            DIST_BACKUP="$FRONTEND_BASE/dist.initial-backup.$(date +%Y%m%d%H%M%S).v$VERSION_VALUE"
            [[ ! -e "$DIST_BACKUP" && ! -L "$DIST_BACKUP" ]]
            mv -- "$FRONTEND_DIST" "$DIST_BACKUP"
            DIST_MIGRATED=1
          elif [[ -e "$FRONTEND_DIST" && ! -L "$FRONTEND_DIST" ]]; then
            echo "ERROR: frontend dist exists but is not a directory or symlink." >&2
            exit 1
          fi

          ln -s "$BACKEND_RELEASE" "$BACKEND_LINK_TMP"
          mv -Tf -- "$BACKEND_LINK_TMP" "$BACKEND_CURRENT"
          BACKEND_SWITCHED=1

          ln -s "$FRONTEND_RELEASE" "$FRONTEND_LINK_TMP"
          mv -Tf -- "$FRONTEND_LINK_TMP" "$FRONTEND_CURRENT"
          FRONTEND_SWITCHED=1

          if [[ ! -e "$FRONTEND_DIST" && ! -L "$FRONTEND_DIST" ]]; then
            ln -s "$FRONTEND_CURRENT/dist" "$FRONTEND_DIST"
          elif [[ -L "$FRONTEND_DIST" ]]; then
            [[ "$(readlink "$FRONTEND_DIST")" == "$FRONTEND_CURRENT/dist" ]] || {
              echo "ERROR: frontend dist symlink points somewhere unexpected; refusing to replace it." >&2
              exit 1
            }
          fi

          bash -lc "$RESTART_CMD"

          # OpenAPI is a basic process health check, not a database/Agent integration test.
          healthy=0
          for attempt in $(seq 1 36); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8000/openapi.json -o /dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          [[ "$healthy" -eq 1 ]] || {
            echo "ERROR: FastAPI OpenAPI health check failed." >&2
            exit 1
          }

          [[ -s "$FRONTEND_CURRENT/dist/index.html" ]]
          if command -v curl >/dev/null 2>&1; then
            curl --connect-timeout 3 --max-time 10 -kfsS \
              --resolve test.online3.me:443:127.0.0.1 \
              https://test.online3.me/ -o /dev/null
          fi

          DEPLOY_OK=1
          trap - ERR INT TERM
          echo "Deployment succeeded: $RELEASE_TAG ($GIT_SHA)"
          echo "Backend release: $BACKEND_RELEASE"
          echo "Frontend release: $FRONTEND_RELEASE"
          echo "Rollback history retained; no old releases were deleted."
          REMOTE
