name: Build and Upload Agent Test

on:
  push:
    branches:
      - agent_lad
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent-test
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: vue-project/package-lock.json

      - name: Install Vue dependencies
        working-directory: vue-project
        run: |
          npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Verify Rolldown native binding
        working-directory: vue-project
        run: |
          node --version
          npm --version
          npm ls @rolldown/binding-linux-x64-gnu

      - name: Build Vue frontend
        working-directory: vue-project
        env:
          VITE_API_BASE_URL: https://api-test.online3.me/api
        run: |
          npm run build
          test -f dist/index.html

      - name: Check backend files
        run: |
          test -f back/app/main.py
          test -f back/app/config.py
          test -f back/app/agent/crud/kb.py
          test -f back/requirements-deploy.txt
          python3 -m compileall -q back/app

      - name: Package backend
        run: |
          tar \
            --exclude='back/.env' \
            --exclude='back/.env*' \
            --exclude='back/**/.env*' \
            --exclude='back/venv' \
            --exclude='back/.venv' \
            --exclude='back/__pycache__' \
            --exclude='back/**/__pycache__' \
            --exclude='back/data/chroma' \
            --exclude='back/data/uploads' \
            --exclude='back/uploads' \
            --exclude='back/model-cache' \
            --exclude='back/.pytest_cache' \
            --exclude='back/.git' \
            -czf "$RUNNER_TEMP/backend.tar.gz" back

          tar -tzf "$RUNNER_TEMP/backend.tar.gz" | awk 'NR <= 40'

          tar -xOf "$RUNNER_TEMP/backend.tar.gz" \
            back/app/agent/crud/kb.py > "$RUNNER_TEMP/kb.py"

          grep -Fq 'import pysqlite3' "$RUNNER_TEMP/kb.py"
          grep -Fq 'sys.modules["sqlite3"] = pysqlite3' "$RUNNER_TEMP/kb.py"
          echo "SQLite compatibility code check passed."

          tar -xOf "$RUNNER_TEMP/backend.tar.gz" \
            back/requirements-deploy.txt > "$RUNNER_TEMP/requirements-deploy.txt"

          grep -Fxq 'pysqlite3-binary==0.5.4' \
            "$RUNNER_TEMP/requirements-deploy.txt"
          echo "SQLite compatibility dependency check passed."

      - name: Package frontend
        run: |
          tar -czf "$RUNNER_TEMP/frontend.tar.gz" -C vue-project dist
          tar -tzf "$RUNNER_TEMP/frontend.tar.gz" | awk 'NR <= 20'

      - name: Validate release archives
        run: |
          python3 - "$RUNNER_TEMP/backend.tar.gz" "$RUNNER_TEMP/frontend.tar.gz" <<'PY'
          import posixpath
          import sys
          import tarfile

          for archive in sys.argv[1:]:
              entries = {}

              with tarfile.open(archive, "r:gz") as tar:
                  for member in tar:
                      name = member.name

                      if not name or "\x00" in name or "\\" in name:
                          raise SystemExit(f"Invalid archive path: {name!r}")

                      if name.startswith("/"):
                          raise SystemExit(f"Absolute path rejected: {name!r}")

                      parts = name.rstrip("/").split("/")

                      if any(part in ("", ".", "..") for part in parts):
                          raise SystemExit(f"Unsafe archive path: {name!r}")

                      normalized = posixpath.normpath(name)

                      if normalized in entries:
                          raise SystemExit(f"Duplicate archive path: {name!r}")

                      if not (member.isdir() or member.isfile()):
                          raise SystemExit(
                              f"Unsupported archive entry type: {name!r}"
                          )

                      for index in range(1, len(parts)):
                          parent = "/".join(parts[:index])
                          if entries.get(parent) == "file":
                              raise SystemExit(
                                  f"File used as parent directory: {parent!r}"
                              )

                      if member.isfile():
                          prefix = normalized + "/"
                          if any(path.startswith(prefix) for path in entries):
                              raise SystemExit(
                                  f"File conflicts with child paths: {name!r}"
                              )

                      entries[normalized] = (
                          "dir" if member.isdir() else "file"
                      )

              print(f"Archive validation passed: {archive}")
          PY



      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts


      - name: Upload release files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          VERSION_FILE="VERSION"
          test -f "$VERSION_FILE"
          RELEASE_ID="$(tr -d '[:space:]' < "$VERSION_FILE")"
          [[ "$RELEASE_ID" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid VERSION: $RELEASE_ID" >&2
            exit 1
          }
          echo "Deploy version: $RELEASE_ID"
          UPLOAD_ID="${RELEASE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          STAGING="/home/deploy/deploy-staging"
          INCOMING="$STAGING/incoming/$UPLOAD_ID"
          READY="$STAGING/ready/$RELEASE_ID"


          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

          printf '%s\n' "$RELEASE_ID" > "$RUNNER_TEMP/release_id"

          (
            cd "$RUNNER_TEMP"
            sha256sum backend.tar.gz frontend.tar.gz release_id > SHA256SUMS
          )

          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -p "$DEPLOY_PORT" "$REMOTE" \
            "test -d '$STAGING' && test -w '$STAGING'"

          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -p "$DEPLOY_PORT" "$REMOTE" \
            bash -s -- "$STAGING" "$UPLOAD_ID" <<'REMOTE'
          set -euo pipefail

          STAGING="$1"
          UPLOAD_ID="$2"
          INCOMING="$STAGING/incoming/$UPLOAD_ID"

          mkdir -p "$STAGING/incoming" "$STAGING/ready"

          if [[ -e "$INCOMING" || -L "$INCOMING" ]]; then
              echo "ERROR: 上传目录已存在，拒绝复用：$INCOMING" >&2
              exit 1
          fi

          mkdir -m 750 "$INCOMING"
          REMOTE

          scp \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/release_id" \
            "$RUNNER_TEMP/SHA256SUMS" \
            "$RUNNER_TEMP/backend.tar.gz" \
            "$RUNNER_TEMP/frontend.tar.gz" \
            "$REMOTE:$INCOMING/"

          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -p "$DEPLOY_PORT" "$REMOTE" \
            bash -s -- "$STAGING" "$UPLOAD_ID" "$RELEASE_ID" <<'REMOTE'
          set -euo pipefail

          STAGING="$1"
          UPLOAD_ID="$2"
          RELEASE_ID="$3"

          INCOMING="$STAGING/incoming/$UPLOAD_ID"
          READY="$STAGING/ready/$RELEASE_ID"

          [[ -d "$INCOMING" && ! -L "$INCOMING" ]]
          [[ "$(tr -d '\r\n' < "$INCOMING/release_id")" == "$RELEASE_ID" ]]

          (
            cd "$INCOMING"
            sha256sum -c SHA256SUMS
          )

          tar -tzf "$INCOMING/backend.tar.gz" >/dev/null
          tar -tzf "$INCOMING/frontend.tar.gz" >/dev/null

          if [[ -e "$READY" || -L "$READY" ]]; then
              [[ -d "$READY" && ! -L "$READY" ]] || {
                  echo "ERROR: ready 路径异常，拒绝覆盖" >&2
                  exit 1
              }

              (
                cd "$READY"
                sha256sum -c SHA256SUMS
              )

              cmp -s "$INCOMING/SHA256SUMS" "$READY/SHA256SUMS"
              cmp -s "$INCOMING/release_id" "$READY/release_id"

              rm -rf -- "$INCOMING"
              echo "相同版本及校验清单已存在，复用已验证的发布包。"
          else
              mv -T -- "$INCOMING" "$READY"
              echo "发布包已通过校验并移入 ready 目录。"
          fi

          echo "注意：本步骤只上传和校验，不执行应用部署。"
          REMOTE

      - name: Deploy backend and retain recent releases
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_RESTART_CMD: ${{ secrets.BACKEND_RESTART_CMD }}
        run: |
          set -euo pipefail

          RELEASE_ID="$(tr -d '[:space:]' < VERSION)"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          STAGING="/home/deploy/deploy-staging"
          READY="$STAGING/ready/$RELEASE_ID"
          TARGET_BASE="/www/wwwroot/fastapi/fastapi-test"

          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -p "$DEPLOY_PORT" "$REMOTE" \
            bash -s -- "$READY" "$TARGET_BASE" "$STAGING" "$RELEASE_ID" "${BACKEND_RESTART_CMD:-}" <<'REMOTE'
          set -euo pipefail

          READY="$1"
          TARGET_BASE="$2"
          STAGING="$3"
          RELEASE_ID="$4"
          RESTART_CMD="${5:-}"

          RELEASES_ROOT="$TARGET_BASE/releases"
          RELEASE_DIR="$RELEASES_ROOT/$RELEASE_ID"
          CURRENT_BACK="$TARGET_BASE/current/back"
          TEMP_DIR="$RELEASES_ROOT/.${RELEASE_ID}.tmp.$$"

          test -f "$READY/backend.tar.gz"
          test -d "$TARGET_BASE"

          rm -rf -- "$TEMP_DIR"
          mkdir -p "$TEMP_DIR" "$RELEASES_ROOT"
          tar -xzf "$READY/backend.tar.gz" -C "$TEMP_DIR"

          test -d "$TEMP_DIR/back"
          test -f "$TEMP_DIR/back/app/main.py"

          rm -rf -- "$RELEASE_DIR"
          mv -- "$TEMP_DIR" "$RELEASE_DIR"

          mkdir -p "$TARGET_BASE/current"
          rm -rf -- "$CURRENT_BACK"
          cp -a "$RELEASE_DIR/back" "$CURRENT_BACK"

          echo "Deployed version $RELEASE_ID"
          echo "Release: $RELEASE_DIR/back"
          echo "Current: $CURRENT_BACK"

          if [[ -n "$RESTART_CMD" ]]; then
              bash -lc "$RESTART_CMD"
          fi

          find "$RELEASES_ROOT" -mindepth 1 -maxdepth 1 -type d ! -name '.*.tmp.*' -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +3 \
            | cut -d' ' -f2- \
            | while IFS= read -r old_release; do
                  rm -rf -- "$old_release"
                  echo "Removed old release: $old_release"
              done

          find "$STAGING/ready" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +3 \
            | cut -d' ' -f2- \
            | while IFS= read -r old_release; do
                  rm -rf -- "$old_release"
              done
          REMOTE